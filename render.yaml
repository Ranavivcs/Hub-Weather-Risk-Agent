# Render Blueprint: one Docker web service. The API key is entered in the Render dashboard, never here.
services:
  - type: web
    name: hub-weather-risk-agent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-5-5
      # Optional score-change alerts (bonus): leave unset to disable the endpoint
      - key: ALERT_TOKEN
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
